# Auto-merge safe Dependabot updates so they can't pile up.
#
# For a Dependabot PR, this ENABLES GitHub auto-merge only when the update is a
# patch or minor bump. GitHub then merges it *by itself once the required "verify"
# check (see meta-verify.yml) passes* — because `main` has branch protection with
# "verify" required. So nothing merges unless CI is green.
#
# MAJOR updates (and anything whose CI fails) are deliberately NOT auto-merged —
# they stay open for a human look. This is the whole safety model: the gate is the
# guard, and majors are opt-in.
#
# Requires the repo setting "Allow auto-merge" to be ON (enabled via `gh api`).

name: dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Enable auto-merge for patch/minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
