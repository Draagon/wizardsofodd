# CouncilTurn — one wizard's contribution to a council, or an error frame.
# Phase A entity; retrofitted to YAML in Phase F. Structured columns in Phase O.
metadata:
  package: wizardsofodd
  children:
    - object.entity:
        name: CouncilTurn
        children:
          - source.rdb:
              table: council_turns
          - field.string:
              name: councilId
              maxLength: 16
              required: true
          - field.int:
              name: ordinal
              required: true
          # VESTIGIAL: the follow-up-rounds feature was removed (commit 6fa5567).
          # This column is kept rather than dropped because D1 migrations are
          # append-only and dropping it would force a table rewrite; every turn
          # now records round 0. Marked deprecated so tooling (not just a comment)
          # sees it as dead.
          - field.int:
              name: round
              deprecated: true
              required: true
          - field.string:
              name: wizardId
              extends: Wizard.id
          - field.string:
              name: wizardName
              extends: Wizard.name
          - field.enum:
              name: kind
              values: [wizard, error]
              required: true
          - field.enum:
              name: stance
              extends: wizardStance
              required: true
          # The take-core is the persisted form of WizardOutput — single-source the
          # shape from the owner; keyClaims/citations keep the entity's physical
          # column names + jsonb storage as overrides on top of the inherited shape.
          - field.string:
              name: takeMarkdown
              extends: WizardOutput.takeMarkdown
          - field.string:
              name: oneLineSummary
              extends: WizardOutput.oneLineSummary
          - field.float:
              name: confidence
              extends: WizardOutput.confidence
          - field.string:
              name: keyClaims
              extends: WizardOutput.keyClaims
              column: key_claims_json
          - field.object:
              name: citations
              extends: WizardOutput.citations
              column: citations_json
              storage: jsonb
          - identity.primary:
              fields: [councilId, ordinal]
          - identity.reference:
              name: fk_council
              fields: [councilId]
              references: Council
          - relationship.composition:
              name: council
              objectRef: Council
              cardinality: one
              onDelete: cascade
