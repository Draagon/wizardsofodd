# Council — persisted record of one Wizards of Odd session.
# Phase A entity; retrofitted to YAML in Phase F. Verdict columns expanded in Phase O.
metadata:
  package: wizardsofodd
  children:
    - object.entity:
        name: Council
        children:
          - source.rdb:
              table: councils
          - field.string:
              name: id
              extends: shortSlug   # see metaobjects/abstracts/meta-short-slug-field.yaml
          - field.string:
              name: visitorId
              maxLength: 64
              required: true
          - field.string:
              name: question
              extends: CouncilRequest.question   # the 600-char cap the endpoint enforces
          - field.enum:
              name: status
              extends: councilStatus
              required: true
          # The verdict columns are the persisted form of VerdictOutput: each one
          # extends the VerdictOutput field it stores, so its type, enum values and
          # validators (confidence's 0-1 range, which becomes a CHECK) come from the
          # owner. They are optional here because a council has no verdict until it
          # completes. The generated lineage mappers (Council.lineage.ts) copy a
          # verdict onto these columns and back.
          - field.enum:
              name: verdictStance
              extends: VerdictOutput.stance
              required: false
          - field.float:
              name: verdictConfidence
              extends: VerdictOutput.confidence
              required: false
          - field.string:
              name: verdictMarkdown
              extends: VerdictOutput.takeMarkdown
              required: false
          - field.enum:
              name: verdictEvidenceQuality
              extends: VerdictOutput.evidenceQuality
              required: false
          - field.object:
              name: dissents
              extends: VerdictOutput.dissents
              column: dissents_json
              storage: jsonb   # explicit on the persisted column (the default; stated for clarity)
              required: false
          - field.string:
              name: verdictAgreements
              extends: VerdictOutput.agreements
              column: verdict_agreements_json
          - field.string:
              name: verdictSplits
              extends: VerdictOutput.splits
              column: verdict_splits_json
          - field.string:
              name: verdictVerifyNote
              extends: VerdictOutput.verifyNote
              column: verdict_verify_note
          # createdAt/completedAt are epoch-millis stored as field.long (INTEGER),
          # matching the live D1 schema. Deliberately NOT field.timestamp: the TS
          # sqlite timestamp codec is string-mode, which would change the column
          # type + wire format. This is the match-the-code choice, not an oversight.
          - field.long:
              name: createdAt
              required: true
          - field.long:
              name: completedAt
              required: false
          - identity.primary:
              fields: [id]
          - relationship.composition:
              name: turns
              objectRef: CouncilTurn
              cardinality: many
