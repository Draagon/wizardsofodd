# TurnLens — projection of one prior wizard's turn shown to subsequent wizards.
# Phase O: carries the WizardOutput fields (stance + takeMarkdown + oneLineSummary
# + confidence) so downstream wizards can reason about prior takes in structured
# form.
metadata:
  package: wizardsofodd
  children:
    - object.value:
        name: TurnLens
        children:
          - field.string:
              name: wizardId
              extends: Wizard.id
          - field.string:
              name: wizardName
              extends: Wizard.name
          - field.enum:
              name: stance
              extends: wizardStance
              required: true
          # The take-core is a projection of WizardOutput — single-source its shape
          # (oneLineSummary's 140 cap, confidence's 0–1 validator) from the owner.
          - field.string:
              name: takeMarkdown
              extends: WizardOutput.takeMarkdown
          - field.string:
              name: oneLineSummary
              extends: WizardOutput.oneLineSummary
          - field.float:
              name: confidence
              extends: WizardOutput.confidence
