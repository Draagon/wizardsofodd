# VerdictOutput — the Clerk's synthesized verdict, emitted via tool_use.
metadata:
  package: wizardsofodd
  children:
    - object.value:
        name: VerdictOutput
        children:
          - field.enum:
              name: stance
              extends: guildVerdict
              required: true
          - field.float:
              name: confidence
              required: true
              # Enforce the 0–1 calibration the prompts promise, so an
              # out-of-range value can't reach the tool schema or the UI.
              children:
                - validator.numeric:
                    min: 0
                    max: 1
          - field.string:
              name: takeMarkdown
              required: true
          - field.object:
              name: dissents
              objectRef: Dissent
              isArray: true
              required: true
          - field.enum:
              name: evidenceQuality
              extends: evidenceGrade
              required: true
          - field.string:
              name: agreements
              isArray: true
              required: false
          - field.string:
              name: splits
              isArray: true
              required: false
          - field.string:
              name: verifyNote
              required: false
