# Payload for the Clerk's verdict system prompt.
#
# `roster` is the structured list of wizards (fullName + a `last` flag), each a
# RosterLens; the verdict system template joins the roster with its own ", "
# separator via {{^last}}, {{/last}}, so the comma-joining prose lives IN the
# template — visible to `meta verify` — instead of a code-side .join(", ").
# Replaces the old pre-joined rosterJoined string and the never-rendered
# `wizards` value-object list.
metadata:
  package: wizardsofodd
  children:
    - object.value:
        name: VerdictSystemPayload
        children:
          - field.object:
              name: roster
              objectRef: RosterLens
              isArray: true
              required: true
