# Payload for a wizard's system prompt. Personality is hardcoded in the .mustache file.
#
# `rivals` is the structured list of rival wizards (name + a `last` flag), each a
# RivalLens; the system template renders it with its own ", " separator through
# the shared `wizards/bicker` partial ({{^last}}, {{/last}}), so the comma-joining
# prose lives IN the template — visible to `meta verify`, not manufactured in a
# code-side string builder. `hasRivals` gates the whole "You tend to bicker with…"
# line (it vanishes when a wizard has no rivals).
metadata:
  package: wizardsofodd
  children:
    - object.value:
        name: WizardSystemPayload
        children:
          - field.boolean:
              name: hasRivals
              required: true
          - field.object:
              name: rivals
              objectRef: RivalLens
              isArray: true
          - field.int:
              name: turnNumber
              required: true
