# All wizard prompts (system + user) for the 10 personas — consolidated from 20
# one-node files per the file-organization convention (one file per domain
# concept, multiple nodes per file). The prompt TEXT lives external, in
# data/templates/wizards/<id>-{system,user}.mustache; these nodes bind each
# renderable to its payload value-object.
#
# payloadRef + format repeat per node by necessity: they can't be hoisted into an
# abstract template.prompt + extends, because the loader requires @textRef on
# EVERY template.prompt (own-only) — including the abstract, which omits it — so an
# abstract fails to load. (verify reads effective attrs, but the loader's
# required-attr check is own-only.)
metadata:
  package: wizardsofodd
  children:
    - template.prompt:
        name: brikSystem
        payloadRef: WizardSystemPayload
        textRef: wizards/brik-system
        format: text
    - template.prompt:
        name: brikUser
        payloadRef: WizardUserPayload
        textRef: wizards/brik-user
        format: text
